name: Deploy Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Siapkan Firebase Auth + konfigurasi web app
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE }}
        run: |
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet || true
          node scripts/setup-firebase.mjs || true
          gcloud auth revoke --all --quiet || true
      - run: npm run build
      - name: Deploy (Hosting + Functions)
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE }}
        run: |
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@latest deploy --project claudetradingml --only hosting,functions --non-interactive --force > "$RUNNER_TEMP/deploy.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/deploy.log"
          rm -f "$RUNNER_TEMP/sa.json"
          if [ $code -ne 0 ]; then
            echo "::error title=Deploy gagal::$(grep -v '^$' "$RUNNER_TEMP/deploy.log" | tail -n 14 | tr '\n' '|' | cut -c1-1500)"
          fi
          exit $code
