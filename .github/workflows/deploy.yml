name: Deploy Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm run build
      - name: Deploy (Hosting + Functions)
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE }}
        run: |
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --project claudetradingml --only hosting,functions --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
